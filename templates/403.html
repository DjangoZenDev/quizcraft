{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Access Denied" %} - QuizCraft{% endblock %}

{% block content %}
<div class="container my-5 text-center">
    <div class="py-5">
        <i class="bi bi-shield-lock text-danger" style="font-size: 5rem;"></i>
        <h1 class="mt-3">{% trans "403 - Access Denied" %}</h1>
        <p class="lead text-muted">{% trans "You don't have permission to access this page." %}</p>
        <div class="mt-4">
            <a href="{% url 'quiz:index' %}" class="btn btn-primary btn-lg">
                <i class="bi bi-house"></i> {% trans "Go Home" %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
